# bbtools-infra 正式普通 CI（唯一权威普通入口）。骨架（方案 §2.7）：
# changes → docs-check → build-and-gates（deps 前缀 + Release + debug/network/
# redis-net 串行）→ live → result（唯一 required check）。分类与结果本仓内联
# （changed_files.py/result.py），callee 链已删（D3）；编排归本文件、逻辑归
# scripts/ci/，门禁逐项承载见 gate-inventory 不得放宽。required context
# 为 `result`，保护切换见 out/in-p3b/protection-checklist.md。
name: CI

on:
  pull_request: {branches: [main]}
  push: {branches: [main]}
  workflow_dispatch:
    inputs:
      # 仅手动触发可切换；PR/push 忽略 inputs，恒走 clean 全量门禁路径。
      build-mode:
        description: "构建模式（全部运行 ctest；不影响 required 门禁语义）"
        type: choice
        default: clean
        options: [clean, cache-bypass]
      cache-enabled:
        description: "启用本次 run 内 ccache（跨 run 缓存已阻塞）"
        type: boolean
        default: true

# 顶层最小权限：仅 checkout 的 job 授予 contents: read；无写权限、无 secret、无 OIDC。
permissions: {}

concurrency:
  # PR：github.ref → 只取消同一 PR 旧 run；main/手动：含 run_id → 逐提交独立。
  group: CI-${{ github.event_name == 'pull_request' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_DIR: ${{ github.workspace }}/build
  COROUTINE_DIR: ${{ github.workspace }}/coroutine
  CORE_DIR: ${{ github.workspace }}/bbtools-core
  DEPS_PREFIX: ${{ github.workspace }}/deps-prefix
  BOOST_PREFIX: ${{ github.workspace }}/boost-prefix
  PROTOBUF_PREFIX: ${{ github.workspace }}/protobuf-prefix
  # 锁定 protobuf 3.21.12 配方：framework 固定 40hex SHA 脚本 + Git 对象实算 sha256。
  PROTOBUF_RECIPE_URL: https://raw.githubusercontent.com/yqm-307/bbt-framework/bd9c490541ccad10cf32e15b91bb40104aa86118/scripts/prepare_protobuf.sh
  PROTOBUF_RECIPE_SHA256: d10f129761576cce19283f05c8bd0ef9001cb79a1a83d57f02f00955fb6666af
  DEPS_BUNDLE_TAR: ${{ github.workspace }}/deps-bundle.tar
  DEPS_BUNDLE_META: ${{ github.workspace }}/deps-bundle.meta
  JOBS: 3  # hosted 4 vCPU：固定 3，与三仓统一并发口径一致，不按 nproc 抢占。
  CACHE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.cache-enabled == false && 'false' || inputs.build-mode == 'cache-bypass' && 'false' || 'true' }}

jobs:
  # 变更集 + 分类；无法确定保守回退 unknown（执行全部）。
  changes:
    name: "变更类型检测"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    outputs:
      classification: ${{ steps.diff.outputs.classification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - name: "从真实 diff 计算受限变更集 + 分类（未知保守全部）"
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/ci/changed_files.py
      - name: "clang-format 改动行检查（非必需，D5 第一步只告警）"
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v git-clang-format >/dev/null 2>&1 || command -v clang-format-diff >/dev/null 2>&1 \
            || command -v clang-format-diff.py >/dev/null 2>&1 \
            || { echo "::warning::clang-format 工具不在 PATH，跳过"; exit 0; }
          bash scripts/ci/check_format_diff.sh "origin/${{ github.base_ref }}"

  # docs-check：链接/文件名/README 行数；恒跑。
  docs-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false}
      - run: python3 -I scripts/ci/check_docs.py --root . --readme-max 200

  # 依赖准备 + Release + debug/network/redis-net 窄入口合并为一个 job（in-p3b
  # repair：PR 可见 check 收敛到 ≤5）。deps 段产出 bundle 供本 job 与 live 双
  # 锚定；gate 段顺序为 release → debug → network → redis-net（gate-inventory
  # 逐项承载不变，串行执行不放宽任何门禁）。
  build-and-gates:
    needs: [changes]
    if: ${{ needs.changes.outputs.classification != 'docs-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {contents: read}
    outputs:
      bundle_sha256: ${{ steps.pack.outputs.bundle_sha256 }}
      coro_ref: ${{ steps.deps.outputs.coro_ref }}
      coroutine_pin_sha: ${{ steps.pin.outputs.coroutine_pin_sha }}
    env:
      REPO_DIR: ${{ github.workspace }}/infra
      WORKSPACE: ${{ github.workspace }}
    steps:
      # ---- deps 段（原 deps job，job 内步骤直接产出无需下载） ----
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: infra, fetch-depth: 1, persist-credentials: false}
      - name: "读取 coroutine pin（cmake/coroutine.sha，fail-closed）"
        id: pin
        run: bash infra/scripts/ci/verify_coroutine_pin.sh infra/cmake/coroutine.sha
      - name: "拉取 bbtools-coroutine @ pin"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yqm-307/bbtools-coroutine
          ref: ${{ steps.pin.outputs.coroutine_pin_sha }}
          path: coroutine
          fetch-depth: 1
          persist-credentials: false
      - name: "拉取 bbtools-core @ master"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: yqm-307/bbtools-core, ref: master,
               path: bbtools-core, fetch-depth: 1, persist-credentials: false}
      - name: "复现锁定依赖前缀（Boost/hiredis/mongo*/protobuf + pin 校验）"
        id: deps
        env:
          COROUTINE_PIN_SHA: ${{ steps.pin.outputs.coroutine_pin_sha }}
        run: |
          bash infra/scripts/ci/prepare_deps.sh \
            --repo-dir "$GITHUB_WORKSPACE/infra" \
            --coroutine-dir "$COROUTINE_DIR" --core-dir "$CORE_DIR" \
            --boost-prefix "$BOOST_PREFIX" --deps-prefix "$DEPS_PREFIX" \
            --protobuf-prefix "$PROTOBUF_PREFIX" \
            --protobuf-recipe-url "$PROTOBUF_RECIPE_URL" \
            --protobuf-recipe-sha256 "$PROTOBUF_RECIPE_SHA256" \
            --coroutine-pin-sha "$COROUTINE_PIN_SHA" --jobs "$JOBS"
      - name: "打包 prepared deps（tar，保留 symlink）"
        id: pack
        run: |
          bash infra/scripts/ci/deps_bundle.sh pack \
            --root "$GITHUB_WORKSPACE" --out "$DEPS_BUNDLE_TAR" --meta "$DEPS_BUNDLE_META"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deps-bundle
          path: |
            ${{ env.DEPS_BUNDLE_TAR }}
            ${{ env.DEPS_BUNDLE_META }}
          if-no-files-found: error
          retention-days: 1
      # ---- Release 门禁（原 build-test job；bundle 已在 workspace 直接复用） ----
      - name: "资源前缀拒绝路径回归（A/B，早停）"
        run: bash infra/tests/resource-prefix/run.sh
      - name: "解析本次 run 内 ccache（跨 run 缓存已阻塞）"
        id: cache-meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || '' }}
          REPO: ${{ github.repository }}
        run: bash infra/scripts/ci/resolve_ccache.sh
      - name: "Release 全量门禁（构建 + ctest + RPC/HTTP + 符号 + ldd）"
        timeout-minutes: 25
        env:
          LAUNCHER: ${{ steps.cache-meta.outputs.enabled == 'true' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
        run: bash infra/scripts/ci/release_gate.sh
      # ---- 窄入口门禁（原 gates matrix 三项，改为本 job 串行 step，不展开 check） ----
      - name: "debug_gate 门禁（构建 + 注册集实跑零跳过）"
        timeout-minutes: 25
        env:
          BUILD_DIR: ${{ github.workspace }}/build-debug_gate
          LAUNCHER: ${{ env.CACHE_ENABLED == 'true' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
        run: bash infra/scripts/ci/debug_gate.sh
      - name: "network_gate 门禁（构建 + 注册集实跑零跳过）"
        timeout-minutes: 25
        env:
          BUILD_DIR: ${{ github.workspace }}/build-network_gate
          LAUNCHER: ${{ env.CACHE_ENABLED == 'true' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
        run: bash infra/scripts/ci/network_gate.sh
      - name: "network-test-results artifact 恒上传"
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-test-results
          path: |
            ${{ github.workspace }}/build-network_gate/registered.json
            ${{ github.workspace }}/build-network_gate/network.xml
            ${{ github.workspace }}/build-network_gate/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 7
      - name: "redis_net_gate 门禁（构建 + 注册集实跑零跳过）"
        timeout-minutes: 25
        env:
          BUILD_DIR: ${{ github.workspace }}/build-redis_net_gate
          LAUNCHER: ${{ env.CACHE_ENABLED == 'true' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
        run: bash infra/scripts/ci/redis_net_gate.sh
      - name: "redis-net-test-results artifact 恒上传"
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: redis-net-test-results
          path: |
            ${{ github.workspace }}/build-redis_net_gate/registered.json
            ${{ github.workspace }}/build-redis_net_gate/redis-net.xml
            ${{ github.workspace }}/build-redis_net_gate/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 7

  # 真实 Redis/Mongo live 门禁（独立 job：live 与构建失败分离；复用同 run
  # prepared deps 只构建 live 三 target；step 上界 redis 19/mongo 16 > 脚本内界）。
  # needs build-and-gates（上游 deps 段同一 job 产出 bundle 与 pin 三输出）。
  live:
    needs: [changes, build-and-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    env:
      REPO_DIR: ${{ github.workspace }}/infra
      EXPECTED_BUNDLE_SHA: ${{ needs.build-and-gates.outputs.bundle_sha256 }}
      EXPECTED_COROUTINE_SHA: ${{ needs.build-and-gates.outputs.coro_ref }}
      COROUTINE_PIN_SHA: ${{ needs.build-and-gates.outputs.coroutine_pin_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: infra, fetch-depth: 1, persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: deps-bundle}
      - name: "校验解包 + pin 双钉"
        run: |
          set -euo pipefail
          bash infra/scripts/ci/deps_bundle.sh unpack \
            --tar "$DEPS_BUNDLE_TAR" --meta "$DEPS_BUNDLE_META" \
            --expect-sha "$EXPECTED_BUNDLE_SHA" --dest "$GITHUB_WORKSPACE"
          actual=$(git -C "$COROUTINE_DIR" rev-parse HEAD)
          { test "$actual" = "$EXPECTED_COROUTINE_SHA" && test "$actual" = "$COROUTINE_PIN_SHA"; } \
            || { echo "FAIL: coroutine pin 双钉不符（${actual}）" >&2; exit 1; }
      - name: "Release 构建 live 目标（不重跑全量 ctest）"
        timeout-minutes: 15
        run: |
          set -euo pipefail
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"
          cmake -S "$REPO_DIR" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DBOOST_ROOT="$BOOST_PREFIX" -DCMAKE_PREFIX_PATH="$BOOST_PREFIX" \
            -DBBT_COROUTINE_SOURCE_DIR="$COROUTINE_DIR" -DBBT_CORE_SOURCE_DIR="$CORE_DIR" \
            -DBBT_HIREDIS_PREFIX="$DEPS_PREFIX/hiredis" \
            -DBBT_MONGOCXX_PREFIX="$DEPS_PREFIX/mongocxx" -DBBT_MONGOC_PREFIX="$DEPS_PREFIX/mongoc"
          cmake --build "$BUILD_DIR" --parallel "$JOBS" --target \
            Test_redis_live Test_redis_cotcp_binding Test_mongo_live
      - name: "真实 Redis live 门禁（有界 fail-closed）"
        timeout-minutes: 19
        run: bash infra/scripts/ci/live_redis_gate.sh
      - name: "真实 Mongo live 门禁（有界 fail-closed）"
        id: mongo_live_gate
        timeout-minutes: 16
        run: bash infra/scripts/ci/live_mongo_gate.sh
      - name: "上传 Mongo live 失败诊断产物（仅失败）"
        if: ${{ failure() && steps.mongo_live_gate.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mongo-live-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/mongo-live-diagnostics
          if-no-files-found: warn
          retention-days: 7

  result:  # 唯一 required check：always 汇聚 needs.*.result → result.py
    needs: [changes, docs-check, build-and-gates, live]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    env:
      RESULTS_JSON: ${{ format('{{"changes":"{0}","docs-check":"{1}","build-and-gates":"{2}","live":"{3}"}}', needs.changes.result, needs.docs-check.result, needs.build-and-gates.result, needs.live.result) }}
      # changes 失败时 outputs 为空，回退 unknown → 按「执行全部」判。
      CLASSIFICATION: ${{ needs.changes.outputs.classification || 'unknown' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false}
      - name: "汇聚 needs.*.result → verdict（fail-closed，非零即红）"
        run: |
          set -euo pipefail
          printf '{"results":%s,"required":["changes","docs-check"],"optional":["build-and-gates","live"],"classification":"%s"}' \
            "$RESULTS_JSON" "$CLASSIFICATION" | python3 scripts/ci/result.py --file -
