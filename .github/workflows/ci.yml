# bbtools-infra 正式普通 CI（唯一权威普通入口）。
#
# 来源与边界：本文件由已独立审查的 hosted 影子候选（Issue #50 / infra PR #72）升级而来，
# 把普通构建/测试判据迁到 hosted `ubuntu-24.04`，并复用已发布 fixed-SHA 的 framework
# 分类/结果 reusable callee（`bbtools-classify-v1.yml@1c0b0fb0…`）；影子入口
# `.github/workflows/ci-shadow-v1.yml` 已删除，普通 check 只有本 workflow 一个 producer
# （不是新旧双跑，也没有第二套分类/结果公共契约）。
#
# 正式身份与触发（保持不变）：
#   - workflow 文件保持 `.github/workflows/ci.yml`；触发面保持 PR→main / push→main /
#     workflow_dispatch（手动 build-mode、cache-enabled）。
#   - `result` job 保持旧 required check 名「编译 & ctest」且恒 `always()`：把变更分类与
#     全部重型 job 的真实结果交给已发布 callee 的 result 契约；任一必跑 job
#     failure/cancelled/空/意外 skipped → verdict=failure → 非零失败。同名 check「编译 & ctest」
#     只有这一个 producer（唯一权威结果）；不再有第二份跨 job 结果脚本。
#
# 判据（保留现役门禁，逐项迁移到 hosted）：
#   1) prepare-deps：hosted runner 无现役 ARC 镜像里的 /opt/boost，故按 framework 已发布
#      docker/toolchain.lock 的版本/sha256 源码复现锁定 Boost 1.90（工作区私有前缀，只编
#      实际消费组件 context，不改镜像、不装系统包、不写 /usr/local）；复用本仓唯一 recipe
#      `scripts/prepare_resource_deps.sh` 以固定 tag+SHA 源码构建 hiredis/mongoc/mongocxx
#      私有前缀；克隆 coroutine@main / core@master 源码；整体打成单一 tar artifact
#      （保留 symlink，记录 sha256 digest）供 release/debug 复用同一份 prepared deps。
#   2) release：下载同一归档并校验 sha256（artifact provenance 闭包，不匹配即 fail-closed）
#      → resource-prefix fail-closed 回归 A/B（tests/resource-prefix/run.sh，不含 C/D，与
#      现役同范围并如实声明）→ Release 全量 cmake + ctest -j1（含 redis.unit/mongo.unit
#      注册断言、live skipped 如实报告）→ Release 归档无 Debug 观测符号断言 → 依赖来源核查。
#   3) debug：下载同一归档 → Debug 8 项定向门禁（Debug 观测符号断言 + 8 项零跳过）。
#   4) release/debug 均按 callee 分类门控：docs-only 才允许显式跳过；code/unknown 执行全部。
#      分类无法确定（真实 diff 失败/超预算）→ unknown → 执行全部，绝不擅自判绿。
#
# 缓存：hosted 每次干净全量构建；**跨 run ccache/GitHub cache 明确阻塞**——本 workflow
#   不引入未固定完整 SHA 的 cache action，也不恢复/保存跨 run 缓存（#29 冷暖收益在 hosted
#   单独验收）。手动 build-mode/cache-enabled 输入保留，只决定本次 run 内 ccache launcher
#   是否启用（runner 镜像自带 ccache 时），不影响任何通过标准。
#
# Redis/Mongo 真实后端有界 live 门禁：**后段追加在 Release job 内**（复用本 job 已全量
#   构建的 Release 产物 Test_redis_live / Test_redis_cotcp_binding / Test_mongo_live），
#   不新增构建 job、不重编、不引入额外框架。缺 docker/compose/二进制一律非零失败；
#   compose up/health wait 与各阶段测试均有界；结束/失败/trap 只 down -v 本步独占 project
#   （不 prune、不按宽前缀清理他任务资源）。docs-only 在 release job 级 if 已跳过；
#   code/unknown 必跑，任一 live 失败 → release failed → result=failure（fail-closed）。
#
# 非目标（与本仓现役一致，不越界）：不改产品 C++/CMake/依赖锁/AGENTS/release/mirrors/
#   runner；sanitizer、性能门禁、平台矩阵不在本 workflow。live 测试在 release ctest 中
#   无容器时仍如实标 Skipped，真实执行由上述后段 live 门禁承担（不用 mock 或 skip 冒充）。
#
# 公开仓库 + 常驻 hosted：fork PR 会执行 PR head 里的 workflow（内容可被 fork 方修改）；
#   本 workflow 仅 hosted、顶层 `permissions: {}`；fork 审批现为 first_time_contributors，非硬闸门，self-hosted 准入不能靠本注释保证。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # 仅手动触发可切换；PR/push 忽略 inputs，恒走 clean 全量门禁路径。
      build-mode:
        description: "构建模式（全部运行 ctest；不影响 required 门禁语义）"
        type: choice
        default: clean
        options:
          - clean
          - cache-bypass
      cache-enabled:
        description: "启用本次 run 内 ccache 编译缓存（跨 run 缓存已按 hosted 阻塞）"
        type: boolean
        default: true

# 顶层最小权限：仅需要 checkout 的 job 单独授予 contents: read；无写权限、无 secret、无 OIDC。
permissions: {}

concurrency:
  # PR：group 用 github.ref（refs/pull/<N>/merge）→ 只取消**同一 PR**的旧 run；
  # main/手动：group 含 run_id → 逐提交独立、互不取消（保逐提交结果）。
  group: CI-${{ github.event_name == 'pull_request' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_DIR: ${{ github.workspace }}/build
  COROUTINE_DIR: ${{ github.workspace }}/coroutine
  CORE_DIR: ${{ github.workspace }}/bbtools-core
  DEPS_PREFIX: ${{ github.workspace }}/deps-prefix
  BOOST_PREFIX: ${{ github.workspace }}/boost-prefix
  # prepared deps 归档：prepare-deps 产出、Release/Debug 消费
  DEPS_BUNDLE_TAR: ${{ github.workspace }}/deps-bundle.tar
  DEPS_BUNDLE_META: ${{ github.workspace }}/deps-bundle.meta
  # hosted 4 vCPU：固定 3，与三仓统一并发口径一致，不按 nproc 抢占
  JOBS: 3
  # 本次 run 内 ccache 目录（同一 job 内复用；不恢复/保存跨 run 缓存）
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # ccache 容量上限：超出 LRU 淘汰，缓存大小可审计（ccache --show-stats）
  CCACHE_MAXSIZE: 500M
  # 本次 run 内 ccache launcher 是否启用：cache-bypass 或显式关闭时为 false
  CACHE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.cache-enabled == false && 'false' || inputs.build-mode == 'cache-bypass' && 'false' || 'true' }}

jobs:
  # 变更集：从真实 diff 归一为受限路径列表，交给 framework classify callee 分类。
  # 任何无法确定的情形保守回退为 unknown（callee 判定执行全部），绝不擅自判绿。
  # job 名保持现役 required check 名「变更类型检测」，required context 不悬空。
  changes:
    name: "变更类型检测"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed_files_json: ${{ steps.diff.outputs.changed_files_json }}
      classifier_status: ${{ steps.diff.outputs.classifier_status }}
      event_json: ${{ steps.diff.outputs.event_json }}
    steps:
      - name: "拉取代码库（含历史，供三点 diff）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "从真实 diff 计算受限变更集（未知保守全部）"
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/ci/changed_files.py

  # 分类/计划（classification-only）：只调用已发布 callee，不传 results。
  plan:
    name: "分类/计划（framework classify callee）"
    needs: [changes]
    uses: yqm-307/bbt-framework/.github/workflows/bbtools-classify-v1.yml@1c0b0fb0ebc8e7ca3888aa4f6a74d1baecf08cc7
    permissions:
      contents: read
    with:
      repo: ${{ github.repository }}
      source_sha: ${{ github.sha }}
      profile: hosted
      concurrency: "2"
      timeout_minutes: "60"
      event_json: ${{ needs.changes.outputs.event_json }}
      changed_files_json: ${{ needs.changes.outputs.changed_files_json }}
      # required = 恒跑且决定「不得全跳过变绿」的轻量 job；optional = 重型构建/测试 job
      # （仅 docs-only 允许显式跳过）。集合互斥、非空，由 callee 校验。
      required_checks_json: '["changes","plan"]'
      optional_checks_json: '["prepare-deps","release","debug"]'
      classifier_status: ${{ needs.changes.outputs.classifier_status }}

  # 依赖准备：hosted 复现锁定 Boost 1.90 + 经本仓唯一 recipe 源码构建 hiredis/mongoc/
  # mongocxx 私有前缀 + coroutine/core 源码，打成单一 tar（保留 symlink）上传，供
  # Release/Debug 复用同一份 prepared deps。job 名保持现役 check 名。
  prepare-deps:
    name: "依赖准备（固定源前缀归档）"
    needs: [changes, plan]
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.classification != 'docs-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      bundle_sha256: ${{ steps.pack.outputs.bundle_sha256 }}
      coro_ref: ${{ steps.deps.outputs.coro_ref }}
      core_ref: ${{ steps.deps.outputs.core_ref }}
    steps:
      - name: "拉取 bbtools-infra（提供 CI 脚本）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: infra
          fetch-depth: 1
          persist-credentials: false

      - name: "拉取 bbtools-coroutine @ main"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yqm-307/bbtools-coroutine
          ref: main
          path: coroutine
          fetch-depth: 1
          persist-credentials: false

      - name: "拉取 bbtools-core @ master"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yqm-307/bbtools-core
          ref: master
          path: bbtools-core
          fetch-depth: 1
          persist-credentials: false

      - name: "记录上游依赖版本"
        id: deps
        run: |
          cd coroutine
          echo "coro_ref=$(git rev-parse HEAD)" | tee "$GITHUB_OUTPUT"
          git log -1 --format='coroutine main HEAD: %h %s (%ci)'
          cd "$CORE_DIR"
          echo "core_ref=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
          git log -1 --format='core master HEAD: %h %s (%ci)'

      # hosted runner 无现役 ARC 镜像的 /opt/boost（Boost 1.90）。按 framework 已发布
      # docker/toolchain.lock 的版本/sha256 源码复现锁定 Boost `context` 到工作区私有
      # 前缀（下载后 sha256 fail-closed），不改镜像、不装系统包、不写 /usr/local。
      - name: "复现锁定 Boost 1.90（工作区私有前缀）"
        run: bash infra/scripts/ci/prepare_boost.sh "$BOOST_PREFIX" --jobs "$JOBS"

      # Issue #34：复用本仓唯一 recipe，以固定 tag+SHA 源码构建 hiredis/mongoc/mongocxx
      # 私有前缀，钉死 docs/decisions/0003+0004 固定版本；前缀落在 workspace 内，
      # 经 deps_bundle.sh 打成 tar 复用。不写 /usr/local、不装系统包。
      - name: "构建 hiredis/mongoc/mongocxx 私有前缀（唯一 recipe）"
        run: bash infra/scripts/prepare_resource_deps.sh "$DEPS_PREFIX" --jobs "$JOBS"

      # tar 保留 symlink；artifact 只承载 tar 字节，不经 upload-artifact 的目录 symlink 语义。
      - name: "打包 prepared deps（tar，保留 symlink）"
        id: pack
        run: |
          bash infra/scripts/ci/deps_bundle.sh pack \
            --root "$GITHUB_WORKSPACE" \
            --out "$DEPS_BUNDLE_TAR" \
            --meta "$DEPS_BUNDLE_META"

      - name: "上传 prepared deps 归档"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deps-bundle
          path: |
            ${{ env.DEPS_BUNDLE_TAR }}
            ${{ env.DEPS_BUNDLE_META }}
          if-no-files-found: error
          retention-days: 1

  # Release 全量门禁：下载相同 prepared deps，跑现役等价判据（不含 Debug）。
  # job 名保持现役 required check 名「Release 构建 & ctest」。
  release:
    name: "Release 构建 & ctest"
    needs: [changes, plan, prepare-deps]
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.classification != 'docs-only' && needs.prepare-deps.result == 'success' }}
    runs-on: ubuntu-24.04
    # 构建 + ctest + 两套独立 live step（redis 19 / mongo 16）之和；含构建余量，非正常耗时。
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: "拉取 bbtools-infra"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: infra
          fetch-depth: 1
          persist-credentials: false

      - name: "下载 prepared deps 归档（same-run only，仅本 run artifact）"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: deps-bundle
          path: ${{ github.workspace }}

      - name: "校验并解包 prepared deps"
        run: |
          bash infra/scripts/ci/deps_bundle.sh unpack \
            --tar "$DEPS_BUNDLE_TAR" \
            --meta "$DEPS_BUNDLE_META" \
            --expect-sha "${{ needs.prepare-deps.outputs.bundle_sha256 }}" \
            --dest "$GITHUB_WORKSPACE"

      # 资源前缀 fail-closed 回归最小入口（tests/resource-prefix/run.sh）。
      # 只跑 A/B：A) 已存在目录 / 悬浮符号链接 / 锁占用必须 exit 2 拒绝且不删他人锁；
      # B) 克隆失败非零退出、不留半个前缀、锁必须释放。均用本地目录与 git shim，
      # 不联网、不跑 docker、不依赖已构建前缀；放在构建之前，失败即早停。
      - name: "资源前缀拒绝路径回归（A/B，不含 C/D）"
        run: |
          echo "范围：A(fail-closed 拒绝) + B(克隆失败清理)；C/D 需真实前缀，本次不运行。"
          bash infra/tests/resource-prefix/run.sh

      # 跨 run 缓存已按 hosted 阻塞（见文件头）。此步只解析本次 run 内 ccache launcher 的
      # 启用条件：fork PR 不启用；cache-bypass/cache-enabled=false 不启用。
      - name: "解析本次 run 内 ccache 开关（跨 run 缓存已阻塞）"
        id: cache-meta
        run: |
          echo "跨 run ccache/GitHub cache 已按 hosted 明确阻塞：不 restore/save。"
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "fork PR：不启用 ccache launcher"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ env.CACHE_ENABLED }}" != "true" ]; then
            echo "cache-bypass / cache-enabled=false：不启用 ccache launcher"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "干净性预检：无 /usr/local 兜底产物"
        run: |
          echo "=== /usr/local 下的 bbt 痕迹（应为空）==="
          find /usr/local/include/bbt /usr/local/lib -name '*bbt*' 2>/dev/null || true
          echo "=== cmake/编译器版本 ==="
          cmake --version | head -1
          g++ --version | head -1
          ninja --version
          echo "=== 锁定 Boost ==="
          awk '$1=="#define" && $2=="BOOST_VERSION"{print "BOOST_VERSION="$3; exit}' \
              "$BOOST_PREFIX/include/boost/version.hpp"

      - name: "编译（Release，JOBS=3 + ccache）"
        run: |
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"
          # 三级降级：cache-bypass/禁用 → 无 ccache 直编 → 有 ccache 直编（in-run 缓存
          # 只影响速度）。构建恒为 clean（rm -rf BUILD_DIR），任何模式都不改变 ctest 门禁。
          if [ "${{ steps.cache-meta.outputs.enabled }}" = "true" ] && command -v ccache >/dev/null 2>&1; then
            LAUNCHER="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
            ccache -z || true
            echo "ccache: $(ccache --version | head -1)"
            echo "=== ccache 观测（编译前） ==="
            ccache --show-stats || true
          else
            LAUNCHER=""
            echo "ccache 未启用（bypass/禁用/fork PR/不可用）：跳过编译缓存，直接编译"
          fi
          cd "$BUILD_DIR"
          cmake ../infra -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBOOST_ROOT="$BOOST_PREFIX" \
            -DCMAKE_PREFIX_PATH="$BOOST_PREFIX" \
            $LAUNCHER \
            -DBBT_COROUTINE_SOURCE_DIR="$COROUTINE_DIR" \
            -DBBT_CORE_SOURCE_DIR="$CORE_DIR" \
            -DBBT_HIREDIS_PREFIX="$DEPS_PREFIX/hiredis" \
            -DBBT_MONGOCXX_PREFIX="$DEPS_PREFIX/mongocxx" \
            -DBBT_MONGOC_PREFIX="$DEPS_PREFIX/mongoc"
          cmake --build . --parallel "$JOBS"
          if command -v ccache >/dev/null 2>&1 && [ "${{ steps.cache-meta.outputs.enabled }}" = "true" ]; then
            echo "=== ccache 统计（编译后） ==="
            ccache --show-stats || true
          fi

      - name: "ctest -j1"
        run: |
          cd "$BUILD_DIR"
          # Issue #34 A3：先断言两个 unit 已注册——若模块 target 缺失（前缀未
          # 传递或 find_package 失败）导致 redis.unit/mongo.unit 没注册，这里
          # 直接非零失败，不进入 ctest 漏判。
          for t in redis.unit mongo.unit; do
            if ! ctest -N -R "^${t}$" | grep -q "Test.*: ${t}$"; then
              echo "FAIL: '${t}' 未注册（依赖前缀/模块 target 缺失）"
              exit 1
            fi
          done
          # --timeout 只作用于无 TIMEOUT 属性的测试（contract.basics）；
          # http.loopback/http.lifecycle 的 TIMEOUT 60/120 测试属性优先级更高，保持不变。
          # 保持与现役门禁一致的 180：contract.basics 无实测耗时证据就收紧会造成门禁 flake。
          ctest -j1 --output-on-failure --timeout 180
        timeout-minutes: 5

      # Release 侧观测符号不变式：三份归档必须存在且**无** bbt::infra::debug:: 符号。
      # （Debug 侧对应断言在 debug job；两侧合起来等价原同 job 的 nm 交叉检查。）
      - name: "Release 归档无 Debug 观测符号断言"
        run: |
          python3 - "$BUILD_DIR" <<'PY'
          import pathlib, subprocess, sys
          build = sys.argv[1]
          for module in ('http', 'redis', 'mongo'):
              archive = pathlib.Path(build) / 'src' / f'libbbt_infra_{module}.a'
              if not archive.exists():
                  raise SystemExit(f'FAIL: 缺 Release 归档 {archive}')
              symbols = subprocess.check_output(['nm', '-C', str(archive)], text=True)
              if 'bbt::infra::debug::' in symbols:
                  raise SystemExit(f'FAIL: Release {archive} 含 debug 观测符号（Release 必须无符号）')
          print('Release 归档: 三模块均 0 debug 符号 (ok)')
          PY

      - name: "缓存观测汇总"
        run: |
          echo "=== 缓存观测汇总 ==="
          echo "build-mode: ${{ github.event_name == 'workflow_dispatch' && inputs.build-mode || 'default(clean)' }}"
          echo "in-run ccache: ${{ steps.cache-meta.outputs.enabled }}"
          echo "cross-run cache: blocked (hosted)"
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            du -sh "$CCACHE_DIR" || true
            ccache --show-stats || true
          fi

      - name: "依赖来源核查"
        run: |
          cd "$BUILD_DIR"
          echo "=== bbt 源码依赖产物 ==="
          find . \( -name 'libbbt_core.so*' -o -name 'libbbt_coroutine.so*' \) -exec ls -la {} \;
          # P2（core-split）后 coroutine 已自闭环、不再产出 libbbt_core.so（首轮真实 run 实证）：
          # libbbt_coroutine.so 必检，libbbt_core.so 仅告警，不再卡门禁。
          test -n "$(find . -name 'libbbt_coroutine.so*' -print -quit)"
          if [ -z "$(find . -name 'libbbt_core.so*' -print -quit)" ]; then
            echo "WARN: 未见 libbbt_core.so（P2 后预期内）"
          fi
          echo "=== test 二进制 ldd（关键依赖）==="
          for bin in tests/Test_contract_basics tests/Test_http_loopback tests/Test_http_lifecycle \
                     tests/Test_redis_unit tests/Test_mongo_unit; do
            [ -x "$bin" ] || continue
            echo "--- $bin ---"
            ldd "$bin" | grep -E 'bbt|boost|libevent|hiredis|mongo|bson' || echo "(静态/无外部依赖)"
          done

      # 真实 Redis/Mongo 有界 live 门禁：复用本 job 已全量构建的 Release 产物，不重编、
      # 不新增构建 job。缺 docker/compose/任一 live 二进制一律非零失败；两个 run.sh 各自
      # 有界（compose up/health/test/stop/start/cleanup timeout）并只 down -v 本步独占
      # project（不 prune）。两套后端**拆成独立 step**，各自 timeout-minutes 大于对应脚本
      # 内界之和（计入 kill-after 宽限：redis<19min；mongo<16min），避免共享外框先于脚本内界硬杀导致
      # trap 不执行残留。code/unknown 在此必跑，任一 live 失败 → 本 job failed →
      # result=failure（fail-closed）；docs-only 已在 job 级 if 跳过。不产出/上传 artifact。
      - name: "真实 Redis live 门禁（复用 Release 产物，有界 fail-closed）"
        timeout-minutes: 19
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "FAIL: docker 不可用（live 门禁要求真实容器，不得 skip 变绿）" >&2
            exit 1
          fi
          if ! docker compose version >/dev/null 2>&1; then
            echo "FAIL: docker compose 不可用（live 门禁要求真实容器，不得 skip 变绿）" >&2
            exit 1
          fi
          REDIS_BIN="$BUILD_DIR/tests/Test_redis_live"
          COTCP_BIN="$BUILD_DIR/tests/Test_redis_cotcp_binding"
          for b in "$REDIS_BIN" "$COTCP_BIN"; do
            if [ ! -x "$b" ]; then
              echo "FAIL: 缺 Release live 二进制 $b（不得 skip 变绿）" >&2
              exit 1
            fi
          done
          # redis.run.sh 第二参数：redis.cotcp_binding.live 复用同一容器实跑，
          # 覆盖 RemoteError 大值 / 2MiB 大回复回归，不与 Test_redis_live 混计。
          bash "$GITHUB_WORKSPACE/infra/tests/redis-live/run.sh" "$REDIS_BIN" "$COTCP_BIN"
          echo "=== live 容器镜像身份（复用现 compose redis7-alpine，未引入新镜像治理）==="
          docker image inspect redis:7-alpine --format 'redis:7-alpine id={{.Id}}' 2>/dev/null || true

      - name: "真实 Mongo live 门禁（复用 Release 产物，有界 fail-closed）"
        timeout-minutes: 16
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "FAIL: docker 不可用（live 门禁要求真实容器，不得 skip 变绿）" >&2
            exit 1
          fi
          if ! docker compose version >/dev/null 2>&1; then
            echo "FAIL: docker compose 不可用（live 门禁要求真实容器，不得 skip 变绿）" >&2
            exit 1
          fi
          MONGO_BIN="$BUILD_DIR/tests/Test_mongo_live"
          if [ ! -x "$MONGO_BIN" ]; then
            echo "FAIL: 缺 Release live 二进制 $MONGO_BIN（不得 skip 变绿）" >&2
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/infra/tests/mongo-live/run.sh" "$MONGO_BIN"
          echo "=== live 容器镜像身份（复用现 compose mongo8.0，未引入新镜像治理）==="
          docker image inspect mongo:8.0 --format 'mongo:8.0 id={{.Id}}' 2>/dev/null || true

  # #62：Debug 生命周期定向门禁（8 项，零跳过）。下载同一 prepared deps；
  # 不改 runner、不新增依赖下载；缺项/跳过/失败均判负。job 名保持现役 check 名。
  debug:
    name: "Debug 生命周期定向门禁（8 项，零跳过）"
    needs: [changes, plan, prepare-deps]
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.classification != 'docs-only' && needs.prepare-deps.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "拉取 bbtools-infra"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: infra
          fetch-depth: 1
          persist-credentials: false

      - name: "下载 prepared deps 归档（same-run only，仅本 run artifact）"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: deps-bundle
          path: ${{ github.workspace }}

      - name: "校验并解包 prepared deps"
        run: |
          bash infra/scripts/ci/deps_bundle.sh unpack \
            --tar "$DEPS_BUNDLE_TAR" \
            --meta "$DEPS_BUNDLE_META" \
            --expect-sha "${{ needs.prepare-deps.outputs.bundle_sha256 }}" \
            --dest "$GITHUB_WORKSPACE"

      - name: "Debug 配置与构建（8 目标）"
        run: |
          set -euo pipefail
          DEBUG_BUILD_DIR="${BUILD_DIR}-debug"
          LAUNCHER=""
          if [ "${{ env.CACHE_ENABLED }}" = "true" ] && \
             [ "${{ github.event_name }}" != "pull_request" -o "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] && \
             command -v ccache >/dev/null 2>&1; then
            LAUNCHER="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -S "$GITHUB_WORKSPACE/infra" -B "$DEBUG_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBBT_INFRA_STRINGENT_DEBUG=ON \
            -DBOOST_ROOT="$BOOST_PREFIX" -DCMAKE_PREFIX_PATH="$BOOST_PREFIX" \
            $LAUNCHER \
            -DBBT_COROUTINE_SOURCE_DIR="$COROUTINE_DIR" -DBBT_CORE_SOURCE_DIR="$CORE_DIR" \
            -DBBT_HIREDIS_PREFIX="$DEPS_PREFIX/hiredis" \
            -DBBT_MONGOCXX_PREFIX="$DEPS_PREFIX/mongocxx" \
            -DBBT_MONGOC_PREFIX="$DEPS_PREFIX/mongoc"
          cmake --build "$DEBUG_BUILD_DIR" --parallel "$JOBS" --target \
            Test_contract_basics Test_http_session_lifetime_probe \
            Test_http_timer_rearm_probe Test_http_inflight_close_probe \
            Test_http_child_unregister Test_redis_unit Test_redis_cotcp_binding Test_mongo_unit

      - name: "Debug 门禁（符号、8 项测试与零跳过）"
        run: |
          set -euo pipefail
          DEBUG_BUILD_DIR="${BUILD_DIR}-debug"
          # Debug 侧观测符号不变式：三份归档必须存在且**含** bbt::infra::debug:: 符号。
          # （Release 侧"无符号"断言在 release job；两侧合起来等价原同 job 交叉检查。）
          python3 - "$DEBUG_BUILD_DIR" <<'PY'
          import pathlib, subprocess, sys
          build = sys.argv[1]
          for module in ('http', 'redis', 'mongo'):
              archive = pathlib.Path(build) / 'src' / f'libbbt_infra_{module}.a'
              if not archive.exists():
                  raise SystemExit(f'FAIL: 缺 Debug 归档 {archive}')
              symbols = subprocess.check_output(['nm', '-C', str(archive)], text=True)
              if 'bbt::infra::debug::' not in symbols:
                  raise SystemExit(f'FAIL: Debug {archive} 缺 debug 观测符号（STRINGENT_DEBUG 未生效）')
          print('Debug 归档: 三模块均含 debug 观测符号 (ok)')
          PY
          RX='^(contract\.basics|http\.session_lifetime|http\.timer_rearm|http\.inflight_close|http\.child_unregister|redis\.unit|redis\.cotcp_binding|mongo\.unit)$'
          ctest --test-dir "$DEBUG_BUILD_DIR" -j1 -R "$RX" \
            --no-tests=error --output-on-failure --timeout 180 \
            --output-junit "$DEBUG_BUILD_DIR/diagnostics.xml"
          python3 - "$DEBUG_BUILD_DIR/diagnostics.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          expected = {'contract.basics', 'http.session_lifetime', 'http.timer_rearm',
                      'http.inflight_close', 'http.child_unregister', 'redis.unit',
                      'redis.cotcp_binding', 'mongo.unit'}
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          if len(cases) != len(expected) or {c.get('name') for c in cases} != expected:
              raise SystemExit('FAIL: Debug diagnostics test set is incomplete or duplicated')
          if any(c.find(tag) is not None for c in cases for tag in ('skipped', 'failure', 'error')):
              raise SystemExit('FAIL: Debug diagnostics contain skipped/failed/error cases')
          print('Debug diagnostics: 8 passed, 0 failed, 0 skipped')
          PY
        timeout-minutes: 5

  # 唯一权威结果汇聚：**always** 运行，把五个真实 job 结果交给已发布 callee 的 result 契约。
  # 必跑（required=changes/plan）与重型 job（optional=prepare-deps/release/debug）任一
  # failure/cancelled/空/意外 skipped → verdict=failure → 调用非零失败。job 名保持旧
  # required check 名「编译 & ctest」，同名 check 只此一个 producer（不再有第二份结果脚本）。
  result:
    name: "编译 & ctest"
    needs: [changes, plan, prepare-deps, release, debug]
    if: ${{ always() }}
    uses: yqm-307/bbt-framework/.github/workflows/bbtools-classify-v1.yml@1c0b0fb0ebc8e7ca3888aa4f6a74d1baecf08cc7
    permissions:
      contents: read
    with:
      repo: ${{ github.repository }}
      source_sha: ${{ github.sha }}
      profile: hosted
      concurrency: "2"
      timeout_minutes: "60"
      # 复用与 plan 相同的受限输入；changes 失败时其 outputs 为空，显式回退为保守值
      # （空变更 + unknown → callee 判 unknown→执行全部），使 result 仍能汇聚真实 job 结果，
      # 而不是让 callee 因缺输入被拒绝、绕过结果聚合。
      event_json: ${{ needs.changes.outputs.event_json || format('{{"name":"{0}"}}', github.event_name) }}
      changed_files_json: ${{ needs.changes.outputs.changed_files_json || '[]' }}
      required_checks_json: '["changes","plan"]'
      optional_checks_json: '["prepare-deps","release","debug"]'
      classifier_status: ${{ needs.changes.outputs.classifier_status || 'unknown' }}
      # 汇聚五个真实 job 的 needs.*.result（含 skipped），不构造假状态、不省略键。
      results_json: ${{ format('{{"changes":"{0}","plan":"{1}","prepare-deps":"{2}","release":"{3}","debug":"{4}"}}', needs.changes.result, needs.plan.result, needs.prepare-deps.result, needs.release.result, needs.debug.result) }}
