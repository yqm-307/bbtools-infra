# ci-shadow-v1 —— bbtools-infra hosted-only 普通 CI 影子门禁（Issue #50 / 方案 R2/R3/R7/R8）
#
# 定位与边界（本文件只**新增**；不改现役 .github/workflows/ci.yml、产品 C++、依赖锁、
# docker、release、required 规则或 runner）：
#   - 与现役 ci.yml 同判据（README「构建约束」+ CMake 所指构建 + ctest -j1），但使用
#     **完全独立身份**：独立 workflow 名 / check 名 / concurrency group；不共享 artifact
#     或 cache 命名空间（本影子不产出、不消费任何 artifact，尤其不下载 verify canary 的
#     payload；也不使用任何 ccache/GitHub cache 命名空间）。
#   - 不新增 required check、不带发布/基线/真实环境写入；影子失败不改变现役权威结果。
#   - 全部 job 固定 hosted `ubuntu-24.04`；顶层 `permissions: {}`，仅需要 checkout 的 job
#     授予 `contents: read`；无 secret、无 OIDC、不向 callee 透传 secret、无写权限。
#   - 远程 `uses` 全部完整 40-hex SHA pin（actions/checkout v4 已只读核验）。
#   - 分类与结果判定**真实复用已发布、fixed-SHA 的 framework reusable callee**
#     `yqm-307/bbt-framework/.github/workflows/bbtools-classify-v1.yml@5b04115e…`：本仓不复制
#     第二套分类/结果公共契约；changed_files 由本仓真实 diff 计算后作为**受限数据**传入，
#     source（github.sha）与 callee automation 身份由 callee 自身 `job.workflow_*` 分离解析。
#   - 触发面有意最小：仅 push 到分支 `ci/issue-50-hosted-shadow`，以及指向 `main` 的 PR。
#   - concurrency：push 逐提交各一 run（不取消）；PR 只取消**同一 PR** 的旧 run。
#   - 无缓存：每次干净全量构建（等价 ci.yml 的 cache-bypass 路径），不改 #29 现有 ccache 工作。
name: ci-shadow-v1

on:
  push:
    branches: [ci/issue-50-hosted-shadow]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  # 独立 group（现役 ci.yml 为 `CI-${{ github.ref }}`）；PR 取消同 PR 旧 run，
  # push 保留逐提交结果。
  group: ci-shadow-v1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_DIR: ${{ github.workspace }}/build
  COROUTINE_DIR: ${{ github.workspace }}/coroutine
  CORE_DIR: ${{ github.workspace }}/bbtools-core
  BOOST_PREFIX: ${{ github.workspace }}/boost-prefix
  RESOURCE_DEPS_ROOT: ${{ github.workspace }}/deps-prefix
  # hosted 4 vCPU：固定 3，与三仓统一并发口径一致，不按 nproc 抢占
  JOBS: 3

jobs:
  # 变更集：从真实 diff 归一为受限路径列表，交给 framework classify callee 分类。
  # 任何无法确定的情形保守回退为 unknown（callee 判定执行全部），绝不擅自判绿。
  changes:
    name: "shadow 变更集（真实 diff）"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed_files_json: ${{ steps.diff.outputs.changed_files_json }}
      classifier_status: ${{ steps.diff.outputs.classifier_status }}
      event_json: ${{ steps.diff.outputs.event_json }}
    steps:
      - name: "拉取代码库（含历史，供三点 diff）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "从真实 diff 计算受限变更集（未知保守全部）"
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/ci/changed_files.py

  # 分类/计划（classification-only）：只调用已发布 callee，不传 results。
  plan:
    name: "shadow 分类/计划（framework classify callee）"
    needs: [changes]
    uses: yqm-307/bbt-framework/.github/workflows/bbtools-classify-v1.yml@5b04115e5c871b75c6bbf357e2a9bcd2d26ef3f8
    permissions:
      contents: read
    with:
      repo: ${{ github.repository }}
      source_sha: ${{ github.sha }}
      profile: hosted
      concurrency: "2"
      timeout_minutes: "60"
      event_json: ${{ needs.changes.outputs.event_json }}
      changed_files_json: ${{ needs.changes.outputs.changed_files_json }}
      # required = 恒跑且决定"不得全跳过变绿"的轻量 job；optional = 重型构建 job
      # （仅 docs-only 允许显式跳过）。集合互斥、非空，由 callee 校验。
      required_checks_json: '["changes","plan"]'
      optional_checks_json: '["build"]'
      classifier_status: ${{ needs.changes.outputs.classifier_status }}

  # 重型构建 + ctest：仅当分类为 code/unknown 时运行；docs-only 显式跳过。
  # 判据与现役 ci.yml 等价（resource-prefix A/B、hiredis/mongo 固定源前缀、unit 注册
  # 断言、ctest -j1、依赖来源断言、live skipped 如实报告），具体配方在 scripts/ci/。
  build:
    name: "shadow 构建 & ctest（hosted，无缓存）"
    needs: [changes, plan]
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.classification != 'docs-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: "拉取 bbtools-infra"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: infra
          fetch-depth: 1
          persist-credentials: false

      - name: "拉取 bbtools-coroutine @ main"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yqm-307/bbtools-coroutine
          ref: main
          path: coroutine
          fetch-depth: 1
          persist-credentials: false

      - name: "拉取 bbtools-core @ master"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yqm-307/bbtools-core
          ref: master
          path: bbtools-core
          fetch-depth: 1
          persist-credentials: false

      - name: "固定/复现工具链（Boost 1.90 源码前缀）"
        run: bash infra/scripts/ci/prepare_boost.sh "$BOOST_PREFIX"

      - name: "构建 & ctest 门禁（等价现役判据）"
        run: |
          bash infra/scripts/ci/run_infra_gate.sh \
            --infra infra \
            --coroutine "$COROUTINE_DIR" \
            --core "$CORE_DIR" \
            --boost-prefix "$BOOST_PREFIX" \
            --resource-deps-root "$RESOURCE_DEPS_ROOT" \
            --build-dir "$BUILD_DIR" \
            --jobs "$JOBS"

  # 结果汇聚：**always** 运行，把三个真实 job 结果交给已发布 callee 的 result 契约。
  # 必跑（required）失败/cancelled/空/意外 skipped → verdict=failure → 调用非零失败。
  result:
    name: "shadow 结果汇聚（framework result callee）"
    needs: [changes, plan, build]
    if: ${{ always() }}
    uses: yqm-307/bbt-framework/.github/workflows/bbtools-classify-v1.yml@5b04115e5c871b75c6bbf357e2a9bcd2d26ef3f8
    permissions:
      contents: read
    with:
      repo: ${{ github.repository }}
      source_sha: ${{ github.sha }}
      profile: hosted
      concurrency: "2"
      timeout_minutes: "60"
      # 复用与 plan 相同的受限输入；changes 失败时其 outputs 为空，显式回退为保守值
      # （空变更 + unknown → callee 判 unknown→执行全部），使 result 仍能汇聚真实 job 结果。
      event_json: ${{ needs.changes.outputs.event_json || format('{{"name":"{0}"}}', github.event_name) }}
      changed_files_json: ${{ needs.changes.outputs.changed_files_json || '[]' }}
      required_checks_json: '["changes","plan"]'
      optional_checks_json: '["build"]'
      classifier_status: ${{ needs.changes.outputs.classifier_status || 'unknown' }}
      # 汇聚三个真实 job 的 needs.*.result（含 skipped），不构造假状态、不省略键。
      results_json: ${{ format('{{"changes":"{0}","plan":"{1}","build":"{2}"}}', needs.changes.result, needs.plan.result, needs.build.result) }}
